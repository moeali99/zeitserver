# Raspberry Pi Zeit-server (GPS an UART0 /dev/serial0)
# Start: java -Dzeitserver.config=config.pi.properties -jar zeitserver-....jar once

ntp.enabled=true

gps.enabled=true
gps.serial.port=/dev/serial0
gps.baudRate=9600
# true = nur mit Satelliten-Fix (Alufolie-Demo: KEINE DATEN ohne Fix).
# false = Uhr auch ohne Fix (Innenraum) — Folie wirkt dann kaum.
gps.requireFix=true

dcf77.enabled=true
dcf77.gpio.bcm=4
dcf77.pullUp=true
dcf77.activeLow=false
# Sync nur bei echtem ~1,8-s-Puls; Minutenanfang zusätzlich per Systemzeit (NTP)
dcf77.syncPulseMinMs=1700
dcf77.bit0LowMinMs=40
dcf77.bit0LowMaxMs=185
dcf77.bit1LowMinMs=165
dcf77.bit1LowMaxMs=480

rtc.enabled=true
rtc.i2c.bus=1
rtc.i2c.busCandidates=1,2,0
rtc.i2c.address=0x68
rtc.sysfs.epoch=/sys/class/rtc/rtc0/since_epoch
rtc.syncFromSystem=true
rtc.syncIntervalMinutes=5

status.json.path=zeitserver-status.json

accuracy.okSeconds=0.1
web.host=0.0.0.0
web.port=8080

history.retentionMinutes=10
failover.enabled=true
failover.minSourcesNormal=2
metrics.enabled=true
