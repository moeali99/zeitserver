# Zeitserver — Kopie nach Bedarf anpassen oder externe Datei mit -Dzeitserver.config=/pfad/zur/config.properties

# --- NTP (Internet, SNTP) ---
ntp.enabled=true
ntp.host=pool.ntp.org
ntp.timeoutMs=4000

# --- GPS (NMEA über USB‑Seriell, z. B. /dev/ttyUSB0 am Pi, am Mac oft /dev/tty.usbserial-*) ---
gps.enabled=false
gps.serial.port=/dev/ttyUSB0
gps.baudRate=9600

# --- DCF77 (GPIO, nur Raspberry Pi; gpiod/gpiomon) ---
dcf77.enabled=false
# Am Pi typisch BCM 4 — siehe config.pi.properties
dcf77.gpio.bcm=4
dcf77.pullUp=true
dcf77.activeLow=true
dcf77.syncPulseMinMs=700
dcf77.bit0LowMinMs=70
dcf77.bit0LowMaxMs=130
dcf77.bit1LowMinMs=170
dcf77.bit1LowMaxMs=230

# --- RTC DS3231 (nur Pi, I2C) ---
rtc.enabled=false

# --- Monitor ---
monitor.intervalMs=2000
monitor.clearScreen=false
status.json.path=zeitserver-status.json

# Fusion: Quellen weiter vom Median als diese Schwelle (Sekunden) werden ignoriert
fusion.outlierSeconds=2.0

# Genauigkeit: Abweichung zur Referenz ≤ okSeconds gilt als „passt“
accuracy.okSeconds=0.1

# Web-Dashboard (Befehl: web)
web.host=0.0.0.0
web.port=8080

history.retentionMinutes=10
failover.enabled=true
failover.minSourcesNormal=2
metrics.enabled=true
